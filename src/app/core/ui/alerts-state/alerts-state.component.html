<div class="toast toast-end z-50" *ngIf="isVisible">
  <div [ngClass]="alertClass" role="alert" class="alert">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 shrink-0 stroke-current"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        [attr.d]="iconPath"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      />
    </svg>
    <span>{{ message }}</span>
  </div>
</div>
