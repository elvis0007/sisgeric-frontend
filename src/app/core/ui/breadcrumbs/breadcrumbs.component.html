      aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"
        class="h-5 w-5 shrink-0" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M3 1a1 1 0 00-1 1v13a1 1 0 001 1h8v-2H4V3h5.586L12 5.414V7h2V5a1 1 0 00-.293-.707l-3-3A1 1 0 0010 1zm5 7v2h3c.667 0 .725.186.855.447.131.262.145.553.145.553v5h2v-5s.014-.709-.355-1.447C13.275 8.814 12.333 8 11 8z" fill-rule="evenodd" />

        <path d="M9 11h1v1H9zm0-5h1v1H9z" />
        <path d="M9 6c.554 0 1 .446 1 1s-.446 1-1 1-1-.446-1-1 .446-1 1-1zm0 4c.554 0 1 .446 1 1s-.446 1-1 1-1-.446-1-1 .446-1 1-1z" />
      </svg>
      <span class="max-w-0 opacity-0 overflow-hidden whitespace-nowrap transition-[max-width,opacity,margin-left] duration-[180ms] ease-in-out group-hover:max-w-16 group-hover:ml-2 group-hover:opacity-100 group-focus-visible:max-w-16 group-focus-visible:ml-2 group-focus-visible:opacity-100 motion-reduce:transition-none" aria-hidden="true">Volver</span>
    </a>
  </div>
</div>
