<div class="w-full flex flex-col items-center justify-center py-6 px-2 animate-fadeIn">
  <!-- Tarjeta central con barra de progreso llamativa -->
  <div class="flex flex-col items-center justify-center text-center p-6 sm:p-8 rounded-2xl bg-base-200/50 border border-base-300 shadow-sm max-w-lg w-full mb-6 relative overflow-hidden backdrop-blur-xs">
    <!-- Línea superior animada de acento -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-base-300 overflow-hidden">
      <div class="h-full bg-gradient-to-r from-primary via-secondary to-primary animate-indeterminate-bar"></div>
    </div>

    <!-- Icono animado con halo brillante -->
    <div class="relative mb-4">
      <div class="absolute inset-0 rounded-2xl bg-primary/20 blur-md animate-pulse"></div>
      <div class="relative w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-primary-content shadow-lg shadow-primary/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 animate-bounce-subtle" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
    </div>

    <!-- Título y subtítulo -->
    <h4 class="text-base sm:text-lg font-bold text-base-content tracking-tight mb-1">
      {{ message }}
    </h4>
    <p class="text-xs text-base-content/70 mb-4 max-w-sm">
      {{ subtitle }}
    </p>

    <!-- Barra de progreso moderna y llamativa -->
    <div class="w-full max-w-xs sm:max-w-sm space-y-1.5">
      <div class="w-full bg-base-300 rounded-full h-3 overflow-hidden p-0.5 shadow-inner">
        <div class="h-full bg-gradient-to-r from-primary via-secondary to-primary rounded-full animate-progress-glow"></div>
      </div>
      <div class="flex items-center justify-between text-[11px] text-base-content/60 font-medium px-0.5">
        <span class="inline-flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-primary animate-ping"></span>
          <span>Procesando registros...</span>
        </span>
        <span class="font-bold text-primary">Espere un momento</span>
      </div>
    </div>
  </div>

  <!-- Vista previa tipo Skeleton (esqueleto de la tabla que simula los datos por cargar) -->
  <div *ngIf="showSkeleton" class="w-full overflow-hidden rounded-xl border border-base-200 bg-base-100 shadow-xs space-y-2 p-3">
    <!-- Header simulado -->
    <div class="skeleton h-10 w-full rounded-lg opacity-80"></div>
    <!-- Filas simuladas -->
    <div class="skeleton h-12 w-full rounded-lg opacity-60"></div>
    <div class="skeleton h-12 w-full rounded-lg opacity-40"></div>
    <div class="skeleton h-12 w-full rounded-lg opacity-25"></div>
  </div>
</div>
