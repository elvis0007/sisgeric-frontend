<!-- Componente global header -->
<header class="navbar bg-primary shadow-lg px-4">
  <!-- Logo para desktop -->
  <div class="flex-1 hidden md:flex">
    <a (click)="navigateTo('/inicio')" class="btn btn-lg btn-ghost normal-case text-xl p-0">
      <img src="sisrec/assets/images/LogoBlancoEEASA.png" alt="logo" class="h-16 w-auto" />
    </a>
  </div>
  <!-- Hamburguesa para mobile -->
  <div class="flex-1 md:hidden">
    <label class="btn btn-circle swap swap-rotate">
      <input type="checkbox"[checked]="menuSrv.isOpen()" 
      (change)="menuSrv.toggle()" />
      <!-- hamburger icon -->
      <svg class="swap-off fill-current" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
        viewBox="0 0 512 512">
        <path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z" />
      </svg>

      <!-- close icon -->
      <svg class="swap-on fill-current" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
        <polygon
          points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49" />
      </svg>
    </label>
  </div>

  <div class="flex-none gap-2">
    <label class="swap swap-rotate btn-ghost btn-circle">
      <!-- this hidden checkbox controls the state -->
      <input type="checkbox" class="theme-controller" (change)="onThemeChange($event)"
        [checked]="currentTheme === 'dark'" />

      <!-- sun icon -->
      <svg class="swap-off h-7 w-7 fill-current text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
      </svg>

      <!-- moon icon -->
      <svg class="swap-on h-7 w-7 fill-current text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
      </svg>
    </label>

    <div class="relative">
      <button class="btn btn-ghost btn-circle" (click)="openNotificationContent()">
        <div class="indicator">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span *ngIf="unreadNotificationsCount > 0" class="badge badge-sm badge-error indicator-item text-slate-200">{{unreadNotificationsCount}}</span>
      </div>
    </button>
  </div>
  
  <div class="dropdown dropdown-end">
      <label tabindex="0" class="btn btn-ghost btn-circle avatar">
        <div class="w-10 rounded-full" [ngClass]="{'skeleton ': isLoading}">
          <div class="w-10 rounded-full" [ngClass]="{'hidden': isLoading}">
            <img [src]="userPhotoUrl" alt="User avatar" />
          </div>
        </div>
      </label>
      <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-md dropdown-content bg-base-100 rounded-box w-44">
        <li>
          <a (click)="openProfileModal()" class="truncate cursor-pointer hover:text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="w-5 h-5 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            Perfil
          </a>
        </li>
        <li *ngIf="hasRole([ADMINISTRADOR])">
          <details>
            <summary class="truncate cursor-pointer hover:text-primary">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5 mr-2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
              </svg>
              Seguridad
            </summary>
            <ul class="ml-6 mt-2">
              <li>
                <a class="truncate cursor-pointer hover:text-primary" (click)="navigateTo('/inicio/roles')">
                  Roles
                </a>
              </li>
              <li>
                <a class="truncate cursor-pointer hover:text-primary" (click)="navigateTo('/inicio/bitacora')">
                  Bitácora
                </a>
              </li>
              <li>
                <a class="truncate cursor-pointer hover:text-primary" (click)="navigateTo('/inicio/nas')">
                  NAS
                </a>
              </li>
            </ul>
          </details>
        </li>
        <li>
          <a class="truncate cursor-pointer hover:text-primary" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="w-5 h-5 mr-2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
            Cerrar Sesión
          </a>
        </li>
      </ul>
    </div>

  </div>
  
  <!-- Componente de notificaciones fuera de la estructura dropdown -->
  <app-notification-content [notifications]="notifications" (notificationRead)="onNotificationRead()" />
</header>
