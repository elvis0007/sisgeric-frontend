<div class="w-full flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-2 mb-5">
    <!-- Contenedor para los inputs de fecha y búsqueda -->
    <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-7 w-full">
        <!-- Contenedor para los inputs de fecha -->
        <div class="flex flex-col sm:flex-row gap-4 sm:gap-3 w-full sm:w-auto">
            <!-- Input Fecha Desde -->
            <div class="indicator w-full sm:w-auto">
                <span class="indicator-item indicator-top indicator-center badge badge-ghost badge-sm">Fecha Desde</span>
                <div class="relative w-full">
                    <input type="date"
                        [formControl]="startDateControl"
                        [max]="endDateControl.value"
                        class="input input-bordered input-primary w-full pr-10 custom-calendar-picker" />
                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"
                            class="h-5 w-5 text-secondary">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M18 2v2M6 2v2m5.996 9h.008m-.008 4h.008m3.987-4H16m-8 0h.009M8 17h.009M3.5 8h17m-18 4.243c0-4.357 0-6.536 1.252-7.89C5.004 3 7.02 3 11.05 3h1.9c4.03 0 6.046 0 7.298 1.354C21.5 5.707 21.5 7.886 21.5 12.244v.513c0 4.357 0 6.536-1.252 7.89C18.996 22 16.98 22 12.95 22h-1.9c-4.03 0-6.046 0-7.298-1.354C2.5 19.293 2.5 17.114 2.5 12.756zM3 8h18" />
                        </svg>
                    </span>
                </div>
            </div>

            <!-- Input Fecha Hasta -->
            <div class="indicator w-full sm:w-auto">
                <span class="indicator-item indicator-top indicator-center badge badge-ghost badge-sm">Fecha Hasta</span>
                <div class="relative w-full">
                    <input type="date"
                        [formControl]="endDateControl"
                        [min]="startDateControl.value"
                        class="input input-bordered input-primary w-full pr-10 custom-calendar-picker"/>
                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"
                            class="h-5 w-5 text-secondary">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="1.5"
                                d="M18 2v2M6 2v2m5.996 9h.008m-.008 4h.008m3.987-4H16m-8 0h.009M8 17h.009M3.5 8h17m-18 4.243c0-4.357 0-6.536 1.252-7.89C5.004 3 7.02 3 11.05 3h1.9c4.03 0 6.046 0 7.298 1.354C21.5 5.707 21.5 7.886 21.5 12.244v.513c0 4.357 0 6.536-1.252 7.89C18.996 22 16.98 22 12.95 22h-1.9c-4.03 0-6.046 0-7.298-1.354C2.5 19.293 2.5 17.114 2.5 12.756zM3 8h18" />
                        </svg>
                    </span>
                </div>
            </div>
        </div>

        <!-- Contenedor para el input de búsqueda -->
        <div class="flex gap-2 items-center w-full sm:w-auto flex-grow sm:flex-grow-0">
            <div class="relative w-full sm:w-72">
                <input type="text" [formControl]="searchTermControl" class="input input-bordered input-primary w-full pr-10" placeholder="Buscar por usuario, tabla o host..." />
                <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="h-4 w-4 opacity-70">
                        <path fill-rule="evenodd"
                            d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
                            clip-rule="evenodd" />
                    </svg>
                </span>
            </div>
            <button type="button" (click)="clearFilters()" class="btn btn-outline btn-primary flex gap-2 items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                Limpiar
            </button>
        </div>
    </div>

    <!-- Export Button -->
    <div class="w-full sm:w-auto flex justify-center">
        <button class="btn btn-primary w-full sm:w-auto" [disabled]="!hasData" (click)="onExport()">
            <div class="flex flex-row items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M2.859 2.877l12.57-1.795a.5.5 0 0 1 .571.494v20.848a.5.5 0 0 1-.57.494L2.858 21.123a1 1 0 0 1-.859-.99V3.867a1 1 0 0 1 .859-.99M17 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4zm-6.8 9L13 8h-2.4L9 10.286L7.4 8H5l2.8 4L5 16h2.4L9 13.714L10.6 16H13z" />
                </svg>
                <span>EXPORTAR</span>
            </div>
        </button>
    </div>

</div>
