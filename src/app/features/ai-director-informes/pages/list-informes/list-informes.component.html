<div class="w-full">
  <app-breadcrumbs />

  <!-- Contenido principal (se oculta cuando hay ruta hija activa) -->
  <div [hidden]="rutaHijaActiva">
    <h1 class="text-2xl font-bold pb-5 pt-3">Informes</h1>

    <div class="flex flex-col lg:flex-row items-start lg:items-center gap-4 w-full mb-5">
      <app-search-filter class="flex-grow w-full"
        (filterChange)="onFilterChange($event)" (loadingChange)="onLoadingChange($event)" />
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center my-8">
      <span class="loading loading-spinner loading-lg text-secondary"></span>
    </div>
    
    <app-table-informes *ngIf="!isLoading" [informes]="informes" 
      [reloadTable]="reloadTable.bind(this)" />
  </div>

  <router-outlet (activate)="enActivacionRutaHija()" (deactivate)="enDesactivacionRutaHija()"></router-outlet>
</div>
