<div class="w-full space-y-4">
  <div class="flex gap-2 items-center w-full">
    <div class="join flex-grow shadow-sm">
      <!-- Departamento Select -->
      <select 
        [formControl]="departamentoControl"
        class="select select-bordered select-primary join-item w-full max-w-xs text-sm min-w-[157px]"
      >
        <option disabled value="">Seleccioné departamento</option>
        <option *ngFor="let dep of departamentos" [value]="dep">{{ dep }}</option>
      </select>

      <!-- Search Input with Dropdown -->
      <div class="relative join-item flex-1 min-w-[157px]">
        <input 
          [formControl]="searchControl"
          class="input input-bordered input-primary w-full pl-4 pr-10 text-sm rounded-l-none"
          placeholder="Buscar cargo o nombre.."
          (focus)="onInputFocus()"
          (blur)="onInputBlur()"
        />
        
        <!-- Search Icon -->
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16 16"
            fill="currentColor"
            class="h-4 w-4 text-base-content/70"
          >
            <path
              fill-rule="evenodd"
              d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <!-- Dropdown Results -->
        <ul 
          *ngIf="showDropdown" 
          class="absolute z-10 w-full bg-base-100 shadow-lg max-h-60 overflow-auto rounded-lg mt-1 border border-base-200"
        >
        <li *ngFor="let item of filteredItems" (mousedown)="selectItem(item)"
        class="p-2 hover:bg-base-200 cursor-pointer">
        {{ item.cargo }} - {{ item.nombre }}
      </li>

          <!-- Empty State -->
          <li *ngIf="filteredItems?.length === 0" class="p-3 text-center text-base-content/70 text-sm">
            No se encontraron resultados
          </li>
        </ul>
      </div>
    </div>
    <button type="button" (click)="clearFilters()" class="btn btn-outline btn-primary flex gap-2 items-center shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Limpiar
    </button>
  </div>
</div>
