<dialog id="modalFormTipoInforme"
  class="fixed inset-0 w-full h-full z-50 overflow-auto bg-black bg-opacity-50 text-secondary flex items-center justify-center"
  [ngClass]="{ 'hidden': !modalFormSrv.isModalOpen() }" (click)="closeModal()">
  <div class="modal-box max-w-2xl rounded-lg shadow-lg relative" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-bold mb-4">{{ isEditMode ? 'Editar Tipo de informe' : 'Ingresar Tipo de informe' }}</h2>
      <button class="btn btn-sm btn-circle btn-ghost text-lg" (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Estado de loading -->
    <form class="space-y-4" [formGroup]="formTipoInforme" (ngSubmit)="toSend()">
      <div class="form-control">
        <label class="label">
          <span class="label-text font-medium">Tipo de informe*</span>
        </label>
        <input class="input input-bordered w-full" [ngClass]="{
                  'input-primary': !isFieldInvalid('ainti_descripcion'),
                  'input-error': isFieldInvalid('ainti_descripcion')
                }" placeholder="Ingrese la descripción del Tipo de Informe" formControlName="ainti_descripcion" />
        <label class="label" *ngIf="isFieldInvalid('ainti_descripcion')">
          <span class="label-text-alt text-error">Este campo es requerido</span>
        </label>
      </div>
      <div class="flex gap-4 justify-center items-center mt-4">
        <button type="button" class="btn btn-error text-white flex-1 w-full" (click)="closeModal()">CANCELAR</button>
        <button class="btn btn-primary w-full flex-1 text-white" [disabled]="isLoadingSubmint">
          <span *ngIf="isLoadingSubmint" class="loading loading-spinner text-secondary"></span>
          {{isLoadingSubmint ? 'CARGANDO...' : isEditMode ? 'CONFIRMAR' : 'REGISTRAR' }}
        </button>
      </div>
    </form>
  </div>
</dialog>
