<div class="w-full space-y-6">
  <app-breadcrumbs />

  <!-- Centrar los tabs -->
  <div class="flex justify-center">
    <div role="tablist" class="tabs tabs-bordered tabs-boxed">
      <input
        type="radio"
        name="my_tabs_1"
        role="tab"
        class="tab text-center"
        aria-label="Entes de Control"
        (click)="switchTab(1)"
      />
      <input
        type="radio"
        name="my_tabs_1"
        role="tab"
        class="tab text-center"
        aria-label="Tipos de Informe"
        checked="checked"
        (click)="switchTab(2)"
      />
      <!-- <input
        type="radio"
        name="my_tabs_1"
        role="tab"
        class="tab text-center"
        aria-label="Estados de Seguimiento"
        (click)="switchTab(3)"
      /> -->
    </div>
  </div>

  <!-- Tab Content -->
  <div class="p-4">
    <div role="tabpanel" *ngIf="currentTab === 1">
      <app-table-organismo />
    </div>
    <div role="tabpanel" *ngIf="currentTab === 2">
      <app-table-tipo-informe />
    </div>
    <!-- <div role="tabpanel" *ngIf="currentTab === 3">
      <app-table-estado-seg />
    </div> -->
  </div>
</div>
