<div class="flex flex-col lg:flex-row lg:flex-wrap gap-4 w-full">
  <!-- Date Range Group -->
  <div class="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
    <!-- Start Date -->
    <div class="indicator w-full sm:w-auto">
      <span class="indicator-item indicator-top indicator-center badge badge-ghost badge-sm">Fecha Desde</span>
      <div class="relative w-full">
        <input type="date" [formControl]="startDateControl" [max]="endDateControl.value"
          class="input input-bordered input-primary w-full pr-10 custom-calendar-picker" />
        <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"
            class="h-5 w-5 text-secondary">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M18 2v2M6 2v2m5.996 9h.008m-.008 4h.008m3.987-4H16m-8 0h.009M8 17h.009M3.5 8h17m-18 4.243c0-4.357 0-6.536 1.252-7.89C5.004 3 7.02 3 11.05 3h1.9c4.03 0 6.046 0 7.298 1.354C21.5 5.707 21.5 7.886 21.5 12.244v.513c0 4.357 0 6.536-1.252 7.89C18.996 22 16.98 22 12.95 22h-1.9c-4.03 0-6.046 0-7.298-1.354C2.5 19.293 2.5 17.114 2.5 12.756zM3 8h18" />
          </svg>
        </span>
      </div>
    </div>

    <!-- End Date -->
    <div class="indicator w-full sm:w-auto">
      <span class="indicator-item indicator-top indicator-center badge badge-ghost badge-sm">Fecha Hasta</span>
      <div class="relative w-full">
        <input type="date" [formControl]="endDateControl" [min]="startDateControl.value"
          class="input input-bordered input-primary w-full pr-10 custom-calendar-picker" />
        <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"
            class="h-5 w-5 text-secondary">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M18 2v2M6 2v2m5.996 9h.008m-.008 4h.008m3.987-4H16m-8 0h.009M8 17h.009M3.5 8h17m-18 4.243c0-4.357 0-6.536 1.252-7.89C5.004 3 7.02 3 11.05 3h1.9c4.03 0 6.046 0 7.298 1.354C21.5 5.707 21.5 7.886 21.5 12.244v.513c0 4.357 0 6.536-1.252 7.89C18.996 22 16.98 22 12.95 22h-1.9c-4.03 0-6.046 0-7.298-1.354C2.5 19.293 2.5 17.114 2.5 12.756zM3 8h18" />
          </svg>
        </span>
      </div>
    </div>
  </div>

  <!-- Select Group -->
  <div class="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
    <!-- Ente de Control (Multi-Selección) -->
    <div class="indicator w-full sm:w-auto">
      <span class="indicator-item indicator-top indicator-center badge badge-ghost badge-sm">Ente de Control</span>
      <div class="dropdown dropdown-end w-full sm:w-56">
        <div tabindex="0" role="button"
          class="input input-bordered input-primary w-full flex items-center justify-between cursor-pointer font-semibold text-sm">
          <span class="truncate">{{ getOrganismosSeleccionadosLabel() }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-60 flex-shrink-0" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
        <div tabindex="0"
          class="dropdown-content z-[50] p-3 shadow-2xl bg-base-100 rounded-box w-64 sm:w-72 max-w-[85vw] border border-base-200 mt-1 max-h-64 overflow-y-auto overflow-x-hidden">
          <div class="cursor-pointer flex items-center justify-start gap-3 py-1.5 hover:bg-base-200 rounded-lg px-2 select-none"
            (click)="toggleAllOrganismos()">
            <input type="checkbox" class="checkbox checkbox-xs checkbox-primary pointer-events-none"
              [checked]="organismosSeleccionados.length === 0" />
            <span class="text-sm font-bold text-base-content">Todos los Entes</span>
          </div>
          <div class="divider my-1"></div>
          <div *ngFor="let octrl of selectOrgCtrl"
            class="cursor-pointer flex items-center justify-start gap-3 py-1.5 hover:bg-base-200 rounded-lg px-2 select-none"
            (click)="toggleOrganismo(octrl.ainoc_codigo)">
            <input type="checkbox" class="checkbox checkbox-xs checkbox-primary pointer-events-none flex-shrink-0"
              [checked]="organismosSeleccionados.includes(octrl.ainoc_codigo)" />
            <span class="text-sm font-semibold text-base-content whitespace-normal leading-tight">{{ octrl.ainoc_descripcion }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Report Type Select -->
    <div class="indicator w-full sm:w-auto">
      <span class="indicator-item indicator-top indicator-center badge badge-ghost badge-sm">Tipo Informe</span>
      <select class="select select-bordered select-primary w-full sm:w-56" [formControl]="selectTipInformeForm">
        <option value="0">Todos</option>
        <option *ngFor="let inf of selectTipInforme" [value]="inf.ainti_codigo">
          {{inf.ainti_descripcion}}
        </option>
      </select>
    </div>
  </div>

  <!-- Search Input -->
  <div class="flex gap-2 items-center w-full lg:w-auto">
    <div class="relative w-full lg:w-72">
      <input type="text" [formControl]="searchTermControl" class="input input-bordered input-primary w-full pr-10"
        placeholder="Buscar por palabra clave ..." />
      <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="h-4 w-4 opacity-70">
          <path fill-rule="evenodd"
            d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
            clip-rule="evenodd" />
        </svg>
      </span>
    </div>
    <button type="button" (click)="clearFilters()" class="btn btn-outline btn-primary flex gap-2 items-center">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      Limpiar
    </button>
  </div>
</div>
