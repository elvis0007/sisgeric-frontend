<dialog id="modalFormInforme"
  class="fixed inset-0 w-full h-full z-50 overflow-auto bg-black bg-opacity-50 text-secondary flex items-center justify-center"
  [ngClass]="{ 'hidden': !modalService.isModalOpen() }" (click)="closeModal()">

  <div class="modal-box max-w-5xl rounded-lg shadow-lg relative" (click)="$event.stopPropagation()">
    <!-- Evita que los clicks dentro del modal lo cierren -->
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-bold mb-4" [ngClass]="{'opacity-80': isLoading}">{{ isEditMode ? 'Editar Informe' : 'Ingresar Informe' }}</h2>
      <button class="btn btn-sm btn-circle btn-ghost text-lg" (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Estado de loading -->
    <div *ngIf="isLoading" 
         class="absolute inset-0 flex items-center justify-center bg-base-100 bg-opacity-80 z-10">
      <div class="flex flex-col items-center gap-4">
        <span class="loading loading-spinner loading-lg text-secondary"></span>
      </div>
    </div>

    <!-- Formulario -->
    <app-form-create-edit 
      [formInforme]="formInforme"
      [isEditMode]="isEditMode"
      [ngClass]="{'opacity-80': isLoading}"
      [reloadTable]="reloadTable.bind(this)"
    />

  </div>
</dialog>
