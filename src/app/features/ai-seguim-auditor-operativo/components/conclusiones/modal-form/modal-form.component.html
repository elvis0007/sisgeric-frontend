<dialog id="modalFormConclusion"
  class="fixed inset-0 w-full h-full z-50 overflow-auto bg-black bg-opacity-50 text-secondary flex items-center justify-center"
  [ngClass]="{ 'hidden': !modalFormSrv.isModalOpen() }" (click)="closeModal()">
  <div class="modal-box max-w-4xl rounded-lg shadow-lg relative" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-bold mb-4">{{ isEditMode ? 'Editar Conclusión' : 'Ingresar Conclusión' }}</h2>
      <button class="btn btn-sm btn-circle btn-ghost text-lg" (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Estado de loading -->
    <form class="space-y-4" [formGroup]="formConclusion" (ngSubmit)="toSend()">

      <div class="form-control">
        <label class="label">
          <span class="label-text font-medium">Conclusión *</span>
        </label>
        <textarea class="textarea textarea-bordered min-h-[130px] w-full" [ngClass]="{
                  'textarea-primary': !isFieldInvalid('areco_conclusion'),
                  'textarea-error': isFieldInvalid('areco_conclusion')
                }" placeholder="Ingrese el título del hallazgo" formControlName="areco_conclusion"></textarea>
        <label class="label" *ngIf="isFieldInvalid('areco_conclusion')">
          <span class="label-text-alt text-error">Este campo es requerido</span>
        </label>
      </div>

      <div class="flex gap-4 justify-center items-center mt-4">
        <button type="button" class="btn btn-error text-white flex-1 w-full" (click)="closeModal()">CANCELAR</button>
        <button class="btn btn-primary flex-1 w-full text-white" [disabled]="isLoadingSubmint">
          <span *ngIf="isLoadingSubmint" class="loading loading-spinner text-secondary"></span>
          {{isLoadingSubmint ? 'CARGANDO...' : isEditMode ? 'CONFIRMAR' : 'REGISTRAR' }}
        </button>
      </div>

    </form>
  </div>
</dialog>
