<dialog  id="modalAddResponsables" [ngClass]="{ 'hidden': !modalAddResponsSrv.isModalOpen() }" (click)="closeModal()"
    class="fixed inset-0 w-full h-full z-50 overflow-auto bg-black bg-opacity-50 backdrop-blur-sm text-secondary flex items-center justify-center">
    <div class="modal-box max-w-4xl rounded-lg shadow-lg relative items-center justify-center w-full"
        (click)="$event.stopPropagation()">

        <button class="btn btn-sm btn-circle btn-ghost text-lg absolute right-2" (click)="closeModal()">
            ✕
        </button>

        <h2 class="text-2xl font-bold">Seleccionar Responsables</h2>

        <app-table-responsables [responsables]="responsables" (responsablesSelected)="onResponsablesSelected($event)" class="w-full items-center" />
    </div>
</dialog>
