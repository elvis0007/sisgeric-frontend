<dialog id="my_edit_role"
  class="fixed inset-0 w-full h-full z-50 overflow-auto bg-black bg-opacity-50 flex items-center justify-center text-secondary"
  [ngClass]="{ 'hidden': !modalService.isModalOpen() }">
  <div class="modal-box max-w-xl rounded-lg shadow-lg relative">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="closeModal()">
      ✕
    </button>
    <h3 class="text-lg font-bold mb-4">Editar Rol</h3>
    <app-form-role [formRole]="formRole" />
  </div>
</dialog>
