<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-xs p-4 animate-fade-in">
  <div class="bg-base-100 rounded-2xl shadow-2xl border border-base-200 w-full max-w-xl overflow-hidden transform transition-all">
    
    <!-- Modal Header -->
    <div class="bg-primary text-primary-content px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-white/10 rounded-xl text-white flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h3 class="font-bold text-base text-white">Nuevo Periodo / Corte de Evaluación</h3>
          <p class="text-xs text-white/80 font-medium">Configure los parámetros y la fecha límite de evaluación</p>
        </div>
      </div>
      <button (click)="onClose()" class="btn btn-sm btn-circle btn-ghost text-white hover:bg-white/20">✕</button>
    </div>

    <!-- Form Content -->
    <form [formGroup]="periodoForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      
      <!-- Alert Error -->
      <div *ngIf="errorMessage" class="alert alert-error text-xs p-3 rounded-xl font-semibold flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Nombre del Periodo -->
      <div>
        <label class="label text-xs font-bold text-base-content/70 pb-1">Nombre del Periodo *</label>
        <input 
          type="text" 
          formControlName="arcev_nombre" 
          placeholder="Ej: I Trimestre 2026, Corte Especial Presidencia" 
          class="input input-bordered input-sm w-full text-xs font-medium focus:outline-none"
          [class.input-error]="periodoForm.get('arcev_nombre')?.invalid && periodoForm.get('arcev_nombre')?.touched"
        />
        <div *ngIf="periodoForm.get('arcev_nombre')?.invalid && periodoForm.get('arcev_nombre')?.touched" class="text-[11px] text-error font-medium mt-1">
          El nombre del periodo es obligatorio.
        </div>
      </div>

      <!-- Tipo de Periodo & Año -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label text-xs font-bold text-base-content/70 pb-1">Tipo de Periodo *</label>
          <select formControlName="arcev_tipo" class="select select-bordered select-sm w-full text-xs font-semibold focus:outline-none">
            <option *ngFor="let t of tiposPeriodo" [value]="t.value">{{ t.label }}</option>
          </select>
        </div>

        <div>
          <label class="label text-xs font-bold text-base-content/70 pb-1">Año Fiscal *</label>
          <input 
            type="number" 
            formControlName="arcev_anio" 
            class="input input-bordered input-sm w-full text-xs font-medium focus:outline-none"
          />
        </div>
      </div>

      <!-- Rango de Fechas de Emisión -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label text-xs font-bold text-base-content/70 pb-1">Fecha Inicio Emisión *</label>
          <input 
            type="date" 
            formControlName="arcev_fecha_inicio" 
            class="input input-bordered input-sm w-full text-xs font-medium focus:outline-none"
          />
        </div>

        <div>
          <label class="label text-xs font-bold text-base-content/70 pb-1">Fecha Fin Emisión *</label>
          <input 
            type="date" 
            formControlName="arcev_fecha_fin" 
            class="input input-bordered input-sm w-full text-xs font-medium focus:outline-none"
          />
        </div>
      </div>

      <!-- Fecha de Corte -->
      <div>
        <label class="label text-xs font-bold text-primary pb-1">Fecha de Corte (Límite de Evaluación) *</label>
        <input 
          type="date" 
          formControlName="arcev_fecha_corte" 
          class="input input-bordered input-sm w-full text-xs font-bold text-primary focus:outline-none"
        />
        <div class="alert alert-info/10 border border-info/30 rounded-xl p-2.5 mt-2 flex items-start gap-2 text-xs">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-info shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-base-content/80 text-[11px]">
            Esta fecha es el límite para calcular el estado de avance y cumplimiento de recomendaciones.
          </span>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex justify-end gap-3 pt-4 border-t border-base-200 mt-5">
        <button type="button" (click)="onClose()" class="btn btn-error text-white btn-sm text-xs font-bold" [disabled]="isSaving">
          CANCELAR
        </button>
        <button type="submit" class="btn btn-primary btn-sm text-xs font-bold gap-2 shadow-sm" [disabled]="isSaving">
          <span *ngIf="isSaving" class="loading loading-spinner loading-xs"></span>
          <span>GUARDAR PERIODO</span>
        </button>
      </div>

    </form>
  </div>
</div>
